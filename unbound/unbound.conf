server:
    # Listen on all network interfaces (Crucial!)
    interface: 0.0.0.0
    port: 53
    do-ip4: yes
    do-udp: yes
    do-tcp: yes

    # Trust your local networks and Docker bridge ranges
    access-control: 127.0.0.0/8 allow
    access-control: 172.17.0.0/16 allow
    access-control: 192.168.0.0/16 allow
    access-control: 100.64.0.0/10 allow

    # Privacy and security hardens
    hide-identity: yes
    hide-version: yes
    harden-glue: yes
    harden-dnssec-stripped: yes
    use-caps-for-id: no
    edns-buffer-size: 1232
    prefetch: yes
    num-threads: 1

    # Point to the core root servers file you just downloaded
    root-hints: "/opt/unbound/etc/unbound/root.hints"

remote-control:
    control-enable: no
